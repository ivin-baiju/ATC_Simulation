<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-label="Animated Flight Telemetry and Airframe HUD">
  <defs>
    <linearGradient id="hudBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#071b2b"/>
      <stop offset="100%" stop-color="#020810"/>
    </linearGradient>
    <linearGradient id="progressGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#167d8d"/>
      <stop offset="50%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <style>
      .airplane-glide {
        animation: planeGlide 8s ease-in-out infinite alternate;
      }
      .hud-glow {
        animation: hudPulse 3s ease-in-out infinite;
      }
      .altitude-stream {
        animation: altFlicker 2s steps(2, start) infinite;
      }
      @keyframes planeGlide {
        0% { transform: translateX(0px); }
        100% { transform: translateX(240px); }
      }
      @keyframes hudPulse {
        0%, 100% { opacity: 0.7; }
        50% { opacity: 1; }
      }
      @keyframes altFlicker {
        0%, 100% { opacity: 0.9; }
        50% { opacity: 1; }
      }
      @media (prefers-reduced-motion: reduce) {
        .airplane-glide, .hud-glow, .altitude-stream { animation: none !important; }
      }
    </style>
  </defs>

  <rect width="1200" height="260" rx="16" fill="url(#hudBg)" stroke="#167d8d" stroke-width="1.5"/>

  <!-- Left Card: Active Flight HUD -->
  <g transform="translate(40, 36)">
    <!-- Airline Header -->
    <text x="0" y="20" fill="#00f2fe" font-family="-apple-system, BlinkMacSystemFont, monospace" font-size="12" font-weight="700" letter-spacing="1">LIVE TARGET INSPECTION // AIRBUS A320neo</text>
    <text x="0" y="52" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="26" font-weight="800">IndiGo 6E 295F <tspan fill="#64748b" font-size="16">(VT-ITR)</tspan></text>
    
    <!-- Route Progress Bar -->
    <g transform="translate(0, 75)">
      <!-- Origin & Dest Labels -->
      <text x="0" y="0" fill="#38bdf8" font-family="monospace" font-size="14" font-weight="800">VIDP · DEL</text>
      <text x="0" y="16" fill="#94a3b8" font-family="sans-serif" font-size="11">Delhi Indira Gandhi</text>

      <text x="500" y="0" text-anchor="end" fill="#38bdf8" font-family="monospace" font-size="14" font-weight="800">VABB · BOM</text>
      <text x="500" y="16" text-anchor="end" fill="#94a3b8" font-family="sans-serif" font-size="11">Mumbai Chhatrapati Shivaji</text>

      <!-- Bar Track -->
      <line x1="0" y1="36" x2="500" y2="36" stroke="#1e293b" stroke-width="8" stroke-linecap="round"/>
      <line x1="0" y1="36" x2="340" y2="36" stroke="url(#progressGrad)" stroke-width="8" stroke-linecap="round"/>

      <!-- Animated Plane Marker -->
      <g class="airplane-glide" style="transform-origin: 100px 36px;">
        <circle cx="100" cy="36" r="10" fill="#00f2fe" fill-opacity="0.2"/>
        <circle cx="100" cy="36" r="6" fill="#00f2fe"/>
        <path d="M 96 36 L 104 36 M 100 32 L 100 40" stroke="#071b2b" stroke-width="2"/>
      </g>
    </g>

    <!-- Telemetry Badges -->
    <g transform="translate(0, 155)">
      <rect x="0" y="0" width="115" height="38" rx="6" fill="#0b1b2d" stroke="#1e293b"/>
      <text x="12" y="15" fill="#64748b" font-family="sans-serif" font-size="9">ALTITUDE</text>
      <text x="12" y="30" fill="#38bdf8" font-family="monospace" font-size="13" font-weight="700">12,000 ft</text>

      <rect x="125" y="0" width="115" height="38" rx="6" fill="#0b1b2d" stroke="#1e293b"/>
      <text x="137" y="15" fill="#64748b" font-family="sans-serif" font-size="9">GROUND SPEED</text>
      <text x="137" y="30" fill="#38bdf8" font-family="monospace" font-size="13" font-weight="700">280 kts</text>

      <rect x="250" y="0" width="115" height="38" rx="6" fill="#0b1b2d" stroke="#1e293b"/>
      <text x="262" y="15" fill="#64748b" font-family="sans-serif" font-size="9">SQUAWK</text>
      <text x="262" y="30" fill="#10b981" font-family="monospace" font-size="13" font-weight="700">2104 (Mode-S)</text>

      <rect x="375" y="0" width="125" height="38" rx="6" fill="#0b1b2d" stroke="#1e293b"/>
      <text x="387" y="15" fill="#64748b" font-family="sans-serif" font-size="9">FLIGHT PHASE</text>
      <text x="387" y="30" fill="#f59e0b" font-family="monospace" font-size="13" font-weight="700">EN-ROUTE CLIMB</text>
    </g>
  </g>

  <!-- Right Side: 3D Wireframe Airframe HUD -->
  <g transform="translate(680, 24)">
    <rect x="0" y="0" width="480" height="212" rx="12" fill="#06121f" stroke="#167d8d" stroke-width="1.2"/>
    <text x="20" y="28" fill="#5eead4" font-family="monospace" font-size="11" font-weight="700">THREE.JS 3D PROCEDURAL AIRFRAME</text>
    <text x="20" y="46" fill="#64748b" font-family="sans-serif" font-size="11">CFM LEAP-1A Turbofans · Twin Sharklet Wingtips</text>

    <!-- Stylized 3D Top-Down Aircraft Wireframe -->
    <g transform="translate(240, 126)">
      <!-- Wings -->
      <polygon points="0,-55 -8,-50 -120,5 -118,18 -15,10 -15,65 -50,88 -48,96 0,85 48,96 50,88 15,65 15,10 118,18 120,5 8,-50" fill="#0d2338" stroke="#00f2fe" stroke-width="1.4"/>
      <!-- Fuselage centerline -->
      <line x1="0" y1="-55" x2="0" y2="85" stroke="#38bdf8" stroke-dasharray="3 3" stroke-width="1"/>
      <!-- Engines -->
      <rect x="-42" y="-12" width="10" height="24" rx="5" fill="#1e293b" stroke="#00f2fe" stroke-width="1"/>
      <rect x="32" y="-12" width="10" height="24" rx="5" fill="#1e293b" stroke="#00f2fe" stroke-width="1"/>
      <!-- Sharklets -->
      <line x1="-120" y1="5" x2="-120" y2="-6" stroke="#10b981" stroke-width="2.5"/>
      <line x1="120" y1="5" x2="120" y2="-6" stroke="#10b981" stroke-width="2.5"/>
    </g>

    <!-- Specs Annotations -->
    <g transform="translate(20, 186)">
      <text x="0" y="0" fill="#94a3b8" font-family="monospace" font-size="10">WINGSPAN: 35.8m</text>
      <text x="130" y="0" fill="#94a3b8" font-family="monospace" font-size="10">MTOW: 79.0t</text>
      <text x="240" y="0" fill="#94a3b8" font-family="monospace" font-size="10">CRUISE: 450 kts</text>
      <text x="360" y="0" fill="#10b981" font-family="monospace" font-size="10" font-weight="700">WEBGL2: OK</text>
    </g>
  </g>
</svg>