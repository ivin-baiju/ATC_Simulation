<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-label="SkyCommand ATC and FlightRadar Surveillance Engine Animated Banner">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="atcBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050c18"/>
      <stop offset="50%" stop-color="#071b2b"/>
      <stop offset="100%" stop-color="#030810"/>
    </linearGradient>

    <linearGradient id="neonCyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#4facfe"/>
      <stop offset="100%" stop-color="#00f2fe"/>
    </linearGradient>

    <linearGradient id="textGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#d4f6ff"/>
      <stop offset="100%" stop-color="#8ce2f0"/>
    </linearGradient>

    <!-- Radar Sweep Gradient -->
    <radialGradient id="radarSweep" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#16d9e8" stop-opacity="0.35"/>
      <stop offset="70%" stop-color="#167d8d" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#167d8d" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="radarCenterGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0"/>
    </radialGradient>

    <!-- Radar Sweep Cone Gradient -->
    <linearGradient id="sweepCone" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.45"/>
      <stop offset="40%" stop-color="#167d8d" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#071b2b" stop-opacity="0"/>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="radarGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#167d8d" stroke-opacity="0.12" stroke-width="1"/>
      <circle cx="20" cy="20" r="0.8" fill="#167d8d" fill-opacity="0.25"/>
    </pattern>

    <clipPath id="scopeClip">
      <circle cx="940" cy="190" r="148"/>
    </clipPath>

    <clipPath id="cardClip">
      <rect x="0" y="0" width="1200" height="380" rx="20"/>
    </clipPath>

    <style>
      .radar-sweep-beam {
        transform-origin: 940px 190px;
        animation: radarRotate 6s linear infinite;
      }
      .radar-blip-1 {
        animation: blipFade 3s ease-in-out infinite;
      }
      .radar-blip-2 {
        animation: blipFade 3.8s ease-in-out infinite 0.7s;
      }
      .radar-blip-3 {
        animation: blipFade 4.2s ease-in-out infinite 1.4s;
      }
      .radar-blip-4 {
        animation: blipFade 2.6s ease-in-out infinite 2.1s;
      }
      .status-pulse {
        animation: statusBlink 2s ease-in-out infinite;
      }
      .telemetry-scroll {
        animation: tickerSlide 12s linear infinite;
      }
      .vector-trail {
        stroke-dasharray: 4 3;
        animation: dashFlow 1.5s linear infinite;
      }
      .scan-horizon {
        animation: horizonScan 8s ease-in-out infinite;
      }

      @keyframes radarRotate {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes blipFade {
        0%, 100% { opacity: 0.35; transform: scale(0.9); }
        50% { opacity: 1; transform: scale(1.15); }
      }
      @keyframes statusBlink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.35; }
      }
      @keyframes dashFlow {
        to { stroke-dashoffset: -7; }
      }
      @keyframes horizonScan {
        0%, 100% { transform: translateY(0); opacity: 0.2; }
        50% { transform: translateY(320px); opacity: 0.7; }
      }

      @media (prefers-reduced-motion: reduce) {
        .radar-sweep-beam, .radar-blip-1, .radar-blip-2, .radar-blip-3, .radar-blip-4, .status-pulse, .vector-trail, .scan-horizon {
          animation: none !important;
        }
      }
    </style>
  </defs>

  <!-- Container -->
  <g clip-path="url(#cardClip)">
    <!-- Base Background -->
    <rect width="1200" height="380" fill="url(#atcBg)"/>
    <rect width="1200" height="380" fill="url(#radarGrid)"/>

    <!-- Ambient Glow Spots -->
    <circle cx="940" cy="190" r="240" fill="url(#radarCenterGlow)"/>
    <circle cx="200" cy="100" r="180" fill="#167d8d" fill-opacity="0.08"/>

    <!-- Subtle Scanline -->
    <rect class="scan-horizon" x="0" y="20" width="1200" height="2" fill="url(#neonCyan)"/>

    <!-- ================= LEFT: TELEMETRY & BRANDING ================= -->
    <g transform="translate(64, 48)">
      <!-- System Tag Badge -->
      <g>
        <rect x="0" y="0" width="280" height="28" rx="6" fill="#0d2338" stroke="#167d8d" stroke-width="1.2"/>
        <circle class="status-pulse" cx="16" cy="14" r="4.5" fill="#10b981"/>
        <text x="30" y="18" fill="#5eead4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="11.5" font-weight="700" letter-spacing="1.2">LIVE SURVEILLANCE · MODE-S ADS-B</text>
      </g>

      <!-- Main Headline -->
      <text x="0" y="74" fill="url(#textGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="900" letter-spacing="-0.5">
        SKYCOMMAND <tspan fill="#00f2fe">ATC</tspan>
      </text>
      <text x="0" y="104" fill="#a5f3fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="600" letter-spacing="0.2">
        Autonomous Air Traffic Control &amp; FlightRadar Surveillance Platform
      </text>

      <!-- Key Value Propositions -->
      <g transform="translate(0, 134)">
        <!-- Pill 1 -->
        <rect x="0" y="0" width="168" height="32" rx="6" fill="#0b1b2d" stroke="#167d8d" stroke-width="1"/>
        <text x="12" y="20" fill="#99f6e4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="11" font-weight="600">📡 OpenSky ADS-B Stream</text>

        <!-- Pill 2 -->
        <rect x="180" y="0" width="162" height="32" rx="6" fill="#0b1b2d" stroke="#167d8d" stroke-width="1"/>
        <text x="192" y="20" fill="#99f6e4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="11" font-weight="600">🛩️ Three.js 3D Airframes</text>

        <!-- Pill 3 -->
        <rect x="354" y="0" width="176" height="32" rx="6" fill="#0b1b2d" stroke="#167d8d" stroke-width="1"/>
        <text x="366" y="20" fill="#99f6e4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="11" font-weight="600">🛡️ Conflict Incursion Engine</text>
      </g>

      <!-- Airport Hubs Covered -->
      <g transform="translate(0, 192)">
        <text x="0" y="0" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="11" font-weight="600" letter-spacing="1">MAJOR METROPOLITAN TERMINAL AIRSPACES</text>
        <g transform="translate(0, 12)">
          <rect x="0" y="0" width="530" height="42" rx="8" fill="#06121f" stroke="#1e293b" stroke-width="1"/>
          
          <text x="16" y="26" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="12" font-weight="700">VIDP</text>
          <text x="56" y="26" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Delhi</text>
          <text x="96" y="26" fill="#334155">•</text>

          <text x="112" y="26" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="12" font-weight="700">VABB</text>
          <text x="156" y="26" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Mumbai</text>
          <text x="210" y="26" fill="#334155">•</text>

          <text x="226" y="26" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="12" font-weight="700">VOBL</text>
          <text x="270" y="26" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Bengaluru</text>
          <text x="340" y="26" fill="#334155">•</text>

          <text x="356" y="26" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="12" font-weight="700">VOMM</text>
          <text x="404" y="26" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Chennai</text>
          <text x="458" y="26" fill="#334155">•</text>

          <text x="474" y="26" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="12" font-weight="700">EGLL</text>
        </g>
      </g>

      <!-- Live Engine Telemetry Footer -->
      <g transform="translate(0, 274)">
        <text x="0" y="0" fill="#00f2fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="11" font-weight="700">KERNEL v2.4</text>
        <text x="96" y="0" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="11">|  LATENCY: 42ms  |  TRACKED TARGETS: 24+  |  RESOLUTION: 0.1s KINEMATIC</text>
      </g>
    </g>

    <!-- ================= RIGHT: ANIMATED RADAR SCOPE ================= -->
    <g id="radar-scope">
      <!-- Outer Scope Housing Ring -->
      <circle cx="940" cy="190" r="156" fill="#05101c" stroke="#167d8d" stroke-width="2.5"/>
      <circle cx="940" cy="190" r="152" fill="#071b2b" stroke="#00f2fe" stroke-opacity="0.3" stroke-width="1"/>

      <!-- Clipped Scope Content -->
      <g clip-path="url(#scopeClip)">
        <!-- Concentric Range Rings -->
        <circle cx="940" cy="190" r="35" fill="none" stroke="#167d8d" stroke-opacity="0.3" stroke-width="1" stroke-dasharray="2 3"/>
        <circle cx="940" cy="190" r="75" fill="none" stroke="#167d8d" stroke-opacity="0.4" stroke-width="1"/>
        <circle cx="940" cy="190" r="115" fill="none" stroke="#167d8d" stroke-opacity="0.4" stroke-width="1"/>
        <circle cx="940" cy="190" r="145" fill="none" stroke="#167d8d" stroke-opacity="0.5" stroke-width="1.2"/>

        <!-- Range Labels -->
        <text x="944" y="117" fill="#167d8d" font-family="monospace" font-size="9" font-weight="700">10 NM</text>
        <text x="944" y="77" fill="#167d8d" font-family="monospace" font-size="9" font-weight="700">20 NM</text>
        <text x="944" y="47" fill="#167d8d" font-family="monospace" font-size="9" font-weight="700">30 NM</text>

        <!-- Crosshairs -->
        <line x1="790" y1="190" x2="1090" y2="190" stroke="#167d8d" stroke-opacity="0.35" stroke-width="1"/>
        <line x1="940" y1="40" x2="940" y2="340" stroke="#167d8d" stroke-opacity="0.35" stroke-width="1"/>

        <!-- Center Terminal Airport Fix -->
        <circle cx="940" cy="190" r="4" fill="#00f2fe"/>
        <text x="946" y="202" fill="#e2e8f0" font-family="monospace" font-size="10" font-weight="800">VIDP</text>

        <!-- Flight Targets & Vectors -->
        <!-- Aircraft 1: IndiGo A320neo -->
        <g class="radar-blip-1">
          <line class="vector-trail" x1="995" y1="125" x2="1025" y2="100" stroke="#00f2fe" stroke-width="1.5"/>
          <circle cx="995" cy="125" r="4.5" fill="#00f2fe"/>
          <polygon points="995,121 991,129 999,129" fill="#ffffff" transform="rotate(45, 995, 125)"/>
          <rect x="1006" y="115" width="70" height="26" rx="4" fill="#071b2b" fill-opacity="0.85" stroke="#00f2fe" stroke-width="0.8"/>
          <text x="1010" y="126" fill="#00f2fe" font-family="monospace" font-size="9" font-weight="800">6E 295F</text>
          <text x="1010" y="137" fill="#94a3b8" font-family="monospace" font-size="8">120 • 280k</text>
        </g>

        <!-- Aircraft 2: Air India B787-9 -->
        <g class="radar-blip-2">
          <line class="vector-trail" x1="865" y1="135" x2="840" y2="110" stroke="#f59e0b" stroke-width="1.5"/>
          <circle cx="865" cy="135" r="4.5" fill="#f59e0b"/>
          <polygon points="865,131 861,139 869,139" fill="#ffffff" transform="rotate(-40, 865, 135)"/>
          <rect x="800" y="125" width="60" height="26" rx="4" fill="#071b2b" fill-opacity="0.85" stroke="#f59e0b" stroke-width="0.8"/>
          <text x="804" y="136" fill="#f59e0b" font-family="monospace" font-size="9" font-weight="800">AI 804</text>
          <text x="804" y="147" fill="#94a3b8" font-family="monospace" font-size="8">040 • 160k</text>
        </g>

        <!-- Aircraft 3: SpiceJet B737-800 -->
        <g class="radar-blip-3">
          <line class="vector-trail" x1="885" y1="245" x2="905" y2="265" stroke="#ef4444" stroke-width="1.5"/>
          <circle cx="885" cy="245" r="4" fill="#ef4444"/>
          <polygon points="885,241 881,249 889,249" fill="#ffffff" transform="rotate(130, 885, 245)"/>
          <rect x="825" y="240" width="55" height="26" rx="4" fill="#071b2b" fill-opacity="0.85" stroke="#ef4444" stroke-width="0.8"/>
          <text x="829" y="251" fill="#ef4444" font-family="monospace" font-size="9" font-weight="800">SG 142</text>
          <text x="829" y="262" fill="#94a3b8" font-family="monospace" font-size="8">085 • 220k</text>
        </g>

        <!-- Aircraft 4: Vistara A320neo -->
        <g class="radar-blip-4">
          <line class="vector-trail" x1="1015" y1="230" x2="1035" y2="245" stroke="#a855f7" stroke-width="1.5"/>
          <circle cx="1015" cy="230" r="4" fill="#a855f7"/>
          <polygon points="1015,226 1011,234 1019,234" fill="#ffffff" transform="rotate(110, 1015, 230)"/>
          <rect x="1022" y="225" width="55" height="26" rx="4" fill="#071b2b" fill-opacity="0.85" stroke="#a855f7" stroke-width="0.8"/>
          <text x="1026" y="236" fill="#a855f7" font-family="monospace" font-size="9" font-weight="800">UK 992</text>
          <text x="1026" y="247" fill="#94a3b8" font-family="monospace" font-size="8">180 • 340k</text>
        </g>

        <!-- Rotating Radar Beam Wedge -->
        <g class="radar-sweep-beam">
          <!-- Sweep Line -->
          <line x1="940" y1="190" x2="1090" y2="190" stroke="#00f2fe" stroke-width="2.5" stroke-linecap="round"/>
          <!-- Sweep Sector Fan -->
          <path d="M 940 190 L 1088 150 A 150 150 0 0 1 1090 190 Z" fill="url(#sweepCone)"/>
        </g>
      </g>

      <!-- Cardinal Compass Markers on Bezel -->
      <text x="936" y="32" fill="#00f2fe" font-family="monospace" font-size="11" font-weight="800">360°</text>
      <text x="1098" y="194" fill="#00f2fe" font-family="monospace" font-size="11" font-weight="800">090°</text>
      <text x="936" y="356" fill="#00f2fe" font-family="monospace" font-size="11" font-weight="800">180°</text>
      <text x="760" y="194" fill="#00f2fe" font-family="monospace" font-size="11" font-weight="800">270°</text>
    </g>

    <!-- Top Border Highlight -->
    <line x1="0" y1="1" x2="1200" y2="1" stroke="url(#neonCyan)" stroke-width="2"/>
    <line x1="0" y1="379" x2="1200" y2="379" stroke="#167d8d" stroke-opacity="0.4" stroke-width="1"/>
  </g>
</svg>